name: Release

# Pushing a tag like v0.1.0 tests the code, publishes binaries to a GitHub
# release, and pushes a multi-arch image to ghcr.io.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test
      - name: Go tests
        run: |
          go vet ./...
          go test ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build UI
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build archives
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            dir="wardrobe-${GITHUB_REF_NAME}-${os}-${arch}"
            mkdir -p "out/$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "out/$dir/wardrobe$ext" ./cmd/server
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "out/$dir/ingest$ext" ./cmd/ingest
            cp README.md LICENSE .env.example "out/$dir/"
            if [ "$os" = windows ]; then
              (cd out && zip -qr "$dir.zip" "$dir")
            else
              tar -C out -czf "out/$dir.tar.gz" "$dir"
            fi
          done
          (cd out && sha256sum *.zip *.tar.gz > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip out/*.tar.gz out/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
